# Perfil público: Caddy termina TLS y OrbitLens no se publica directamente.
# Uso:
#   docker compose -f compose.yaml -f compose.production.yaml --env-file .env.production up -d --build
services:
  orbitlens:
    environment:
      ORBITLENS_PRODUCTION: "true"
      ORBITLENS_PUBLIC_ORIGIN: ${ORBITLENS_PUBLIC_ORIGIN:?define ORBITLENS_PUBLIC_ORIGIN}
      ORBITLENS_ALLOWED_WEB_HOSTS: ${ORBITLENS_ALLOWED_WEB_HOSTS:?define ORBITLENS_ALLOWED_WEB_HOSTS}
      ORBITLENS_TRUSTED_PROXIES: ${ORBITLENS_TRUSTED_PROXIES:-172.28.0.0/24}
      ORBITLENS_SECURITY_CONTACT: ${ORBITLENS_SECURITY_CONTACT:?define ORBITLENS_SECURITY_CONTACT}
      ORBITLENS_CORS_ORIGINS: ""
      ORBITLENS_ENABLE_DOCS: "false"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      orbitlens:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ORBITLENS_DOMAIN: ${ORBITLENS_DOMAIN:?define ORBITLENS_DOMAIN}
      ORBITLENS_UPSTREAM: orbitlens:8000
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy-data:
  caddy-config:
