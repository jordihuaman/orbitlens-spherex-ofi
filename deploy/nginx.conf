# Nginx 1.24+ de referencia. Sustituir dominio, certificados y ruta del socket.
# OrbitLens debe escuchar solo en 127.0.0.1:8000 (compose.yaml ya lo hace).
limit_req_zone $binary_remote_addr zone=orbitlens_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name orbitlens.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orbitlens.example.org;

    ssl_certificate     /etc/letsencrypt/live/orbitlens.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitlens.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        limit_req zone=orbitlens_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reemplaza, no añade, para que el cliente no falsifique su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 650s;
        proxy_read_timeout 650s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
