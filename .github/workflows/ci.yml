name: Regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python -m ruff check .
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
        env:
          ORBITLENS_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: |
            frontend/test-results
            frontend/playwright-report

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Auditar dependencias Python
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --strict
      - name: Análisis estático Python (medio/alto)
        run: python -m bandit -q -r api.py orbitlens scripts -ll
      - run: npm ci --prefix frontend
      - name: Auditar dependencias JavaScript
        run: npm audit --audit-level=high --prefix frontend
